<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Server-side access control probe</title>
<style>
  body { margin: 0; background: #0f172a; color: #e2e8f0;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 820px; margin: 48px auto; padding: 0 24px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p.sub { color: #94a3b8; margin: 0 0 28px; font-size: 15px; }
  code { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  button { background: #2563eb; color: white; border: 0; border-radius: 8px;
           padding: 14px 22px; font-size: 16px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .card { margin-top: 28px; background: #1e293b; border-radius: 12px; padding: 4px 24px 20px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 20px 0;
         border-bottom: 1px solid #334155; }
  .row:last-child { border-bottom: 0; }
  .role { width: 210px; font-size: 17px; font-weight: 600; }
  .role small { display: block; color: #94a3b8; font-weight: 400; font-size: 13px; }
  .status { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ok { color: #4ade80; } .deny { color: #f87171; } .warn { color: #fbbf24; }
  .body { color: #cbd5e1; font-size: 14px; margin-top: 4px; word-break: break-all; }
  .pending { color: #64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Server-side access control: live API probe</h1>
  <p class="sub">
    Sends the <em>same</em> <code>POST /api/applications/:id/decision</code> request as each role,
    straight to the server (bypassing the UI). Read-only users must be blocked at the API, not just
    in the interface.
  </p>
  <button id="run">Send decision request as Viewer, then Reviewer</button>
  <div class="card" id="out">
    <div class="row"><div class="role">Viewer <small>read-only role</small></div>
      <div><div class="status pending" id="v-status">not run</div><div class="body" id="v-body"></div></div></div>
    <div class="row"><div class="role">Reviewer <small>can decide</small></div>
      <div><div class="status pending" id="r-status">not run</div><div class="body" id="r-body"></div></div></div>
  </div>
</div>
<script>
async function decide(role, name, id) {
  const res = await fetch('/api/applications/' + id + '/decision', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-actor-role': role, 'x-actor-name': name },
    body: JSON.stringify({ action: 'approve' }),
  });
  let msg = '';
  try { msg = JSON.stringify(await res.json()); } catch (e) {}
  return { status: res.status, msg };
}
// Render the real outcome: green only when the status is the expected one, so the
// page reports what the server actually did rather than assuming the result.
function render(prefix, result, expected, label) {
  const status = document.getElementById(prefix + '-status');
  const body = document.getElementById(prefix + '-body');
  const pass = result.status === expected;
  status.textContent = 'HTTP ' + result.status + (pass ? ' (' + label + ')' : ' (unexpected)');
  status.className = 'status ' + (pass ? (expected === 403 ? 'deny' : 'ok') : 'warn');
  body.textContent = result.msg;
}

document.getElementById('run').addEventListener('click', async () => {
  const list = await (await fetch('/api/applications?status=pending')).json();
  const target = list.applications[0];
  if (!target) {
    document.getElementById('v-body').textContent =
      'No pending applications to decide. Run `npm run db:seed` and try again.';
    return;
  }
  render('v', await decide('viewer', 'Vic Viewer', target.id), 403, 'Forbidden');
  render('r', await decide('reviewer', 'Riley Reviewer', target.id), 200, 'decision recorded');
});
</script>
</body>
</html>
